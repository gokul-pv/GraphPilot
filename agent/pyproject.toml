[project]
name = "graphpilot"
version = "0.1.0"
description = "DAG Agent with browser and computer use skills"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "httpx",
    "ddgs",
    "tavily-python",
    "crawl4ai",
    "python-dotenv",
    "pydantic>=2.13.4",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "networkx>=3.2",
    "pyyaml>=6.0",
    # Browser skill.
    "playwright>=1.47",
    "pillow>=10.0",
    "trafilatura>=1.12",
    "lxml>=5.2",
    "lxml-html-clean>=0.1",
    # HTTP API (api.py). uvicorn and sse-starlette arrive transitively via
    # mcp[cli] but are imported directly, so declare them.
    "fastapi>=0.141.1",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "network: test requires internet access",
    "embed: test requires the gateway's embedding endpoint",
]
